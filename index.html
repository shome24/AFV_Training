// 1. Audio Synthesizer (Web Audio API)
// ==========================================================================
class SoundFX {
  constructor() {
    this.ctx = null;
    this.heartbeatInterval = null;
    this.soundEnabled = true;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleSound(enabled) {
    this.soundEnabled = enabled !== undefined ? enabled : !this.soundEnabled;
    if (!this.soundEnabled && this.heartbeatInterval) {
      this.stopHeartbeat();
    }
    return this.soundEnabled;
  }

  playClick() {
    if (!this.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    } catch(e) {}
  }

  playWhoosh() {
    if (!this.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(420, this.ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    } catch(e) {}
  }

  playSuccess() {
    if (!this.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.08);
        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);
      });
    } catch(e) {}
  }

  startHeartbeat() {
    if (!this.soundEnabled || this.heartbeatInterval) return;
    this.init();
    if (!this.ctx) return;
    const beat = () => {
      if (!this.soundEnabled) return;
      try {
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(95, this.ctx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.08);
        gain1.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc1.connect(gain1);
        gain1.connect(this.ctx.destination);
        osc1.start();
        osc1.stop(this.ctx.currentTime + 0.08);

        setTimeout(() => {
          if (!this.soundEnabled || !this.ctx) return;
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(80, this.ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.09);
          gain2.gain.setValueAtTime(0.16, this.ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start();
          osc2.stop(this.ctx.currentTime + 0.09);
        }, 130);
      } catch(e) {}
    };

    beat();
    this.heartbeatInterval = setInterval(beat, 460); // ~130 BPM
  }

  stopHeartbeat() {
    if (this.heartbeatInterval) {
      clearInterval(this.heartbeatInterval);
      this.heartbeatInterval = null;
    }
  }
}

// App Header Bar with Language Switcher
function AppHeader() {
  const { 
    currentStep, 
    totalSteps, 
    goToSlide, 
    currentSlide, 
    t, 
    lang, 
    toggleLanguage,
    soundEnabled, 
    toggleSound, 
    isEditorOpen, 
    setIsEditorOpen 
  } = useTraining();

  const [isDropdownOpen, setIsDropdownOpen] = useState(false);

  return (
    <header className="pnm-app-header">
      <div className="pnm-brand-wrap" onClick={() => goToSlide(1)}>
        <div className="pnm-logo-symbol">
          <span className="pnm-pulse-bar"></span>
          <span className="pnm-pulse-bar"></span>
          <span className="pnm-pulse-bar"></span>
          <span className="pnm-pulse-bar"></span>
        </div>
        <div className="pnm-brand-text">
          <span className="pnm-brand-title">{t.brandTitle}</span>
          <span className="pnm-brand-sub">{t.brandSub}</span>
        </div>
      </div>

      <div className="pnm-header-nav">
        {/* Language Switcher */}
        <button 
          className="pnm-lang-toggle-btn"
          onClick={toggleLanguage}
          title={lang === 'en' ? 'החלף לעברית' : 'Switch to English'}
        >
          <span>🌐</span>
          <span>{lang === 'en' ? 'עברית' : 'English'}</span>
        </button>

        {/* Slide Quick Jump Dropdown */}
        <div className="pnm-slide-selector-dropdown">
          <div 
            className="pnm-slide-selector-pill"
            onClick={() => setIsDropdownOpen(!isDropdownOpen)}
          >
            <span>{currentStep}/{totalSteps}</span>
            <span style={{ fontSize: '0.65rem' }}>▼</span>
          </div>

          {isDropdownOpen && (
            <div className="pnm-dropdown-menu">
              {t.slides.map(s => (
                <div
                  key={s.id}
                  className={`pnm-dropdown-item ${s.id === currentStep ? 'active' : ''}`}
                  onClick={() => {
                    goToSlide(s.id);
                    setIsDropdownOpen(false);
                  }}
                >
                  <span className="pnm-dropdown-badge">{s.id}</span>
                  <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {s.title}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Audio Toggle */}
        <button 
          className={`pnm-header-btn ${soundEnabled ? 'active' : ''}`}
          onClick={toggleSound}
          title="Toggle Audio Feedback"
        >
          <span>{soundEnabled ? '🔊' : '🔇'}</span>
        </button>

        {/* Live Content Editor Drawer Toggle */}
        <button 
          className={`pnm-header-btn ${isEditorOpen ? 'active' : ''}`}
          onClick={() => setIsEditorOpen(!isEditorOpen)}
        >
          <span>{t.editBtn}</span>
        </button>
      </div>
    </header>
  );
}

      {activeDisplay === 1 && (
        <div className="pnm-slide4-display pnm-display-1-view animate-fade-in">
          {/* Top Callout Speech Bubble (pointing down to tutorial) */}
          <div className="pnm-callout-bubble tail-bottom pnm-slide4-callout-top">
            {slide.d1_calloutTop}
          </div>

          {/* Phone Screen Mockup Inner */}
          <div className="pnm-scan-phone-frame">
            {/* Top Area: 3D Tutorial Belly Diagram / Animation */}
            <div className="pnm-tutorial-screen-box">
              <img
                src="assets/slide4_screens/display1_tutorial.png"
                alt="Tutorial Guided Scan"
                className="pnm-tutorial-screen-img"
                onError={(e) => { e.target.src = "assets/afv _p4_i1.jpeg"; }}
              />
              <span className="pnm-screen-expand-btn" title="Expand View">⛶</span>
            </div>

            {/* Bottom Dark Controller Area */}
            <div className="pnm-scan-bottom-control-area">
              <div className="pnm-scan-info-row">
                <span className="pnm-scan-step-pill">{slide.d1_scanStep}</span>
                <span className="pnm-scan-duration-pill">
                  {slide.d1_duration} <span className="pnm-mini-expand">⛶</span>
                </span>
              </div>

              <p className="pnm-tap-to-continue-label">{slide.d1_tapPrompt}</p>

              {/* Big Red Circular Start / Record Button */}
              <div className="pnm-start-scan-btn-wrapper">
                <button
                  className="pnm-red-record-circle-btn"
                  onClick={handleStartScan}
                  title="Start Scan"
                >
                  <span className="pnm-record-inner-circle"></span>
                </button>
              </div>
            </div>
          </div>

          {/* Bottom Callout Speech Bubble (pointing up to the red button) */}
          <div className="pnm-callout-bubble tail-top pnm-slide4-callout-bottom">
            {slide.d1_calloutBottom}
          </div>
        </div>
      )}

      {/* DISPLAY 2: Second Scanning Screen */}
      {activeDisplay === 2 && (
        <div className="pnm-slide4-display pnm-display-2-view animate-fade-in">
          {/* Phone Screen Mockup Inner */}
          <div className="pnm-scan-phone-frame pnm-scan-active-frame">
            {/* Top Area: Probe Movement & Contact Guidance */}

              <img

                onError={(e) => { e.target.src = "assets/afv _p4_i2.jpeg"; }}

                <img
                  src="assets/slide4_screens/display2_feed.png"
                  alt="Ultrasound B-Mode Sonogram"

                  onError={(e) => { e.target.src = "assets/scan_part1_feed.jpg"; }}
                />
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Bottom Navigation Buttons */}
      <div className="pnm-phone-bottom-nav">
        <button
          className="pnm-prev-btn"

              handleBackToTutorial();
            } else {

        <button
          className="pnm-btn-pill-red"
          style={{ flex: 1 }}

            soundFX.playClick();

              setActiveDisplay(2);
            } else {
              nextSlide();
            }
          }}
        >
          {t.nextBtn}
        </button>
      </div>
    </div>
  );

            className={`pnm-header-btn ${selectedQuadrant === idx + 1 ? 'active' : ''}`}
            onClick={() => {
              setSelectedQuadrant(idx + 1);
              soundFX.playClick();
            }}
          >
            {q}
          </button>
        ))}
      </div>

      <div className="pnm-phone-bottom-nav">
        <button className="pnm-prev-btn" onClick={prevSlide}>{t.prevBtn}</button>
        <button className="pnm-btn-pill-red" style={{ flex: 1 }} onClick={nextSlide}>{t.nextBtn}</button>
      </div>
    </div>
  );
}

// --- Slide 12 & 13: Let's check your understanding (Quiz) ---
function Slide12_13_Quiz({ slide, isPassedView = false }) {
  const { nextSlide, prevSlide, goToSlide, soundEnabled, t } = useTraining();
  const [answers, setAnswers] = useState({ q1: null, q2: null, q3: null });
  const [isSubmitted, setIsSubmitted] = useState(isPassedView);
  const [hasErrors, setHasErrors] = useState(false);

  const handleSelect = (qKey, optionIndex) => {
    setAnswers(prev => ({ ...prev, [qKey]: optionIndex }));
    soundFX.playClick();
  };

  const handleSubmit = () => {
    const isQ1Correct = answers.q1 === 0;
    const isQ2Correct = answers.q2 === 3;
    const isQ3Correct = answers.q3 === 1;

    if (isQ1Correct && isQ2Correct && isQ3Correct) {
      setIsSubmitted(true);
      setHasErrors(false);
      if (soundEnabled) soundFX.playSuccess();
      goToSlide(13);
    } else {
      setHasErrors(true);
    }
  };

  return (
    <div className="pnm-slide-card-inner">
      <h2 className="pnm-card-title" style={{ color: '#0284c7' }}>
        {slide.title}
      </h2>
      <p className="pnm-card-subtitle" style={{ color: '#1e293b', fontSize: '0.9rem', marginBottom: '14px' }}>
        {slide.subtitle}
      </p>

      <div className="pnm-quiz-group">
        {/* Question 1 */}
        <div className="pnm-quiz-q-box">
          <div className="pnm-quiz-q-text">
            {slide.q1 || "1. During the scanning session, can you pause the ultrasound scanning?"}
          </div>
          <div className="pnm-quiz-options-row">
            {(slide.q1_opts || ["Yes", "No"]).map((opt, idx) => (
              <label key={idx} className="pnm-quiz-radio-label">
                <input 
                  type="radio" 
                  name="q1" 
                  className="pnm-custom-radio"
                  checked={answers.q1 === idx || (isPassedView && idx === 0)} 
                  onChange={() => handleSelect('q1', idx)}
                />
                <span>{opt}</span>
              </label>
            ))}
          </div>
        </div>

        {/* Question 2 */}
        <div className="pnm-quiz-q-box">
          <div className="pnm-quiz-q-text">
            {slide.q2 || "2. What can you do to optimise your scans?"}
          </div>
          <div className="pnm-quiz-options-row">
            {(slide.q2_opts || ["Add gel", "Press firmly", "Scan slower", "All answers"]).map((opt, idx) => (
              <label key={idx} className="pnm-quiz-radio-label">
                <input 
                  type="radio" 
                  name="q2" 
                  className="pnm-custom-radio"
                  checked={answers.q2 === idx || (isPassedView && idx === 3)} 
                  onChange={() => handleSelect('q2', idx)}
                />
                <span>{opt}</span>
              </label>
            ))}
          </div>
        </div>

        {/* Question 3 */}
        <div className="pnm-quiz-q-box">
          <div className="pnm-quiz-q-text">
            {slide.q3 || "3. Can you close the app immediately after finishing the scan?"}
          </div>
          <div className="pnm-quiz-options-row">
            {(slide.q3_opts || ["Yes", "No, I'll wait for the scan upload confirmation"]).map((opt, idx) => (
              <label key={idx} className="pnm-quiz-radio-label">
                <input 
                  type="radio" 
                  name="q3" 
                  className="pnm-custom-radio"
                  checked={answers.q3 === idx || (isPassedView && idx === 1)} 
                  onChange={() => handleSelect('q3', idx)}
                />
                <span>{opt}</span>
              </label>
            ))}
          </div>
        </div>
      </div>

      {/* Submit or Passed Button */}
      {isSubmitted || isPassedView ? (
        <div style={{ width: '100%', marginTop: '6px' }}>
          <button className="pnm-btn-pill-red w-full" style={{ marginBottom: '6px' }}>
            {slide.passedBtn || "Passed"}
          </button>
          <div className="pnm-quiz-feedback-msg">
            {slide.passedFeedback || "Great! You can proceed to the next slide."}
          </div>
        </div>
      ) : (
        <div style={{ width: '100%', marginTop: '6px' }}>
          <button className="pnm-btn-pill-red w-full" onClick={handleSubmit}>
            {slide.submitBtn || "Submit"}
          </button>
          {hasErrors && (
            <div style={{ color: '#ef4444', fontSize: '0.82rem', marginTop: '6px', fontWeight: 600 }}>
              {slide.errorMsg || "Please check your answers and try again."}
            </div>
          )}
        </div>
      )}

      <div className="pnm-phone-bottom-nav">
        <button className="pnm-prev-btn" onClick={prevSlide}>{t.prevBtn}</button>
        <button className="pnm-btn-pill-red" style={{ flex: 1 }} onClick={nextSlide}>{t.nextBtn}</button>
      </div>
    </div>
  );
}

// --- Slide 14: Congratulations & Completion ---
function Slide14_Completed({ slide }) {
  const { goToSlide } = useTraining();
  const [isClosed, setIsClosed] = useState(false);

  const handleCloseTraining = () => {
    soundFX.playClick();
    try {
      window.open('', '_self');
      window.close();
    } catch (e) {}
    setIsClosed(true);
  };

  if (isClosed) {
    return (
      <div className="pnm-slide-card-inner" style={{ justifyContent: 'center', minHeight: '360px', gap: '16px' }}>
        <div className="pnm-callout-bubble" style={{ fontSize: '1.05rem', fontWeight: 700 }}>
          {slide.closedMessage}
        </div>
      </div>
    );
  }

  return (
    <div className="pnm-slide-card-inner">
      {/* Top Red-Bordered Pill Badge */}
      <div className="pnm-callout-bubble" style={{ fontSize: '1.1rem', fontWeight: 800, marginTop: '24px' }}>
        {slide.badgeText}
      </div>

      {/* Pulsenmore Logo */}
      <div className="pnm-completed-logo-badge" style={{ margin: '24px 0 12px 0' }}>
        <div className="pnm-logo-symbol">
          <span className="pnm-pulse-bar"></span>
          <span className="pnm-pulse-bar"></span>
          <span className="pnm-pulse-bar"></span>
          <span className="pnm-pulse-bar"></span>
        </div>
        <span style={{ fontFamily: 'var(--font-heading)', fontSize: '1.15rem', fontWeight: 800, color: '#11263c' }}>
          {slide.logoText}
        </span>
      </div>

      <p className="pnm-card-body-text" style={{ textAlign: 'center', margin: '10px 0 24px 0' }}>
        {slide.closingText}
      </p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', width: '100%' }}>
        <button className="pnm-btn-pill-red w-full" onClick={() => goToSlide(1)}>
          {slide.restartBtn}
        </button>
        <button className="pnm-prev-btn" style={{ width: '100%', textAlign: 'center' }} onClick={handleCloseTraining}>
          {slide.closeBtn}
        </button>
      </div>
    </div>
  );
}

// ==========================================================================
// 6. Live Content Editor Drawer
// ==========================================================================
function ContentEditorDrawer({ isOpen, onClose, onUpdateSlide }) {
  const { currentStep, currentSlide, t } = useTraining();

  const [title, setTitle] = useState(currentSlide.title || '');
  const [subtitle, setSubtitle] = useState(currentSlide.subtitle || '');
  const [description, setDescription] = useState(currentSlide.description || '');

  useEffect(() => {
    setTitle(currentSlide.title || '');
    setSubtitle(currentSlide.subtitle || '');
    setDescription(currentSlide.description || '');
  }, [currentSlide]);

  const handleSave = () => {
    onUpdateSlide(currentSlide.id, {
      title,
      subtitle,
      description
    });
    soundFX.playClick();
  };

  return (
    <div className={`pnm-editor-drawer ${isOpen ? 'open' : ''}`}>
      <div className="pnm-editor-header">
        <h4 style={{ fontWeight: 800 }}>{t.editBtn}</h4>
        <button className="pnm-modal-close-btn" onClick={onClose}>✕</button>
      </div>
      <div className="pnm-editor-body">
        <div style={{ fontSize: '0.82rem', color: '#64748b' }}>
          {t.slideLabel} <b>{currentSlide.id}: {currentSlide.title}</b>
        </div>

        <div className="pnm-editor-field">
          <label className="pnm-editor-label">Title</label>
          <input 
            className="pnm-editor-input" 
            value={title} 
            onChange={e => setTitle(e.target.value)} 
          />
        </div>

        <div className="pnm-editor-field">
          <label className="pnm-editor-label">Subtitle</label>
          <input 
            className="pnm-editor-input" 
            value={subtitle} 
            onChange={e => setSubtitle(e.target.value)} 
          />
        </div>

        {currentSlide.description !== undefined && (
          <div className="pnm-editor-field">
            <label className="pnm-editor-label">Body Text</label>
            <textarea 
              className="pnm-editor-textarea" 
              value={description} 
              onChange={e => setDescription(e.target.value)} 
            />
          </div>
        )}

        <button className="pnm-btn-pill-red w-full" onClick={handleSave}>
          {t.saveBtn}
        </button>
      </div>
    </div>
  );
}

// ==========================================================================
// 7. Main Application Root Component
// ==========================================================================
function App() {
  const [lang, setLang] = useState('en');
  const [translations, setTranslations] = useState(TRANSLATIONS);
  const [currentStep, setCurrentStep] = useState(1);
  const [soundEnabled, setSoundEnabled] = useState(true);
  const [isEditorOpen, setIsEditorOpen] = useState(false);

  const t = translations[lang] || translations.en;
  const totalSteps = t.slides.length;

  const toggleLanguage = useCallback(() => {
    soundFX.playClick();
    setLang(prev => (prev === 'en' ? 'he' : 'en'));
  }, []);

  const goToSlide = useCallback((step) => {
    soundFX.playClick();
    setCurrentStep(Math.max(1, Math.min(step, totalSteps)));
  }, [totalSteps]);

  const nextSlide = useCallback(() => {
    soundFX.playClick();
    setCurrentStep(prev => (prev < totalSteps ? prev + 1 : 1));
  }, [totalSteps]);

  const prevSlide = useCallback(() => {
    soundFX.playClick();
    setCurrentStep(prev => (prev > 1 ? prev - 1 : 1));
  }, []);

  const toggleSound = useCallback(() => {
    const newState = soundFX.toggleSound();
    setSoundEnabled(newState);
  }, []);

  const updateSlideData = useCallback((slideId, partialData) => {
    setTranslations(prev => ({
      ...prev,
      [lang]: {
        ...prev[lang],
        slides: prev[lang].slides.map(s => s.id === slideId ? { ...s, ...partialData } : s)
      }
    }));
  }, [lang]);

  const currentSlide = useMemo(() => {
    return t.slides.find(s => s.id === currentStep) || t.slides[0];
  }, [t.slides, currentStep]);

  // Keyboard Navigation (< and > arrow keys)
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (isEditorOpen) return;
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        if (lang === 'he' && e.key === 'ArrowRight') prevSlide();
        else nextSlide();
      } else if (e.key === 'ArrowLeft') {
        if (lang === 'he' && e.key === 'ArrowLeft') nextSlide();
        else prevSlide();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [nextSlide, prevSlide, isEditorOpen, lang]);

  // Render Slide Component based on slide ID
  const renderSlideComponent = () => {
    switch (currentStep) {
      case 1:
        return <Slide1_Home slide={currentSlide} />;
      case 2:
        return <Slide2_Part1Intro slide={currentSlide} />;
      case 3:
        return <Slide3_Part1Prep slide={currentSlide} />;
      case 4:
        return <Slide4_Part1Scan slide={currentSlide} />;
      case 5:
        return <Slide5_Part2Intro slide={currentSlide} />;
      case 6:
        return <Slide6_Step1PrepBody slide={currentSlide} />;
      case 7:
        return <Slide7_Step2MapArea slide={currentSlide} />;
      case 8:
        return <Slide8_Step3MovementPace slide={currentSlide} />;
      case 9:
        return <Slide9_Step4DevicePositioning slide={currentSlide} />;
      case 10:
        return <Slide10_LiveFeedbackAlerts slide={currentSlide} />;
      case 11:
        return <Slide11_ProcessingUploading slide={currentSlide} />;
      case 12:
        return <Slide12_13_Quiz slide={currentSlide} isPassedView={false} />;
      case 13:
        return <Slide12_13_Quiz slide={currentSlide} isPassedView={true} />;
      case 14:
        return <Slide14_Completed slide={currentSlide} />;
      default:
        return <Slide1_Home slide={currentSlide} />;
    }
  };

  const contextValue = {
    t,
    lang,
    toggleLanguage,
    currentStep,
    totalSteps,
    currentSlide,
    goToSlide,
    nextSlide,
    prevSlide,
    soundEnabled,
    toggleSound,
    isEditorOpen,
    setIsEditorOpen
  };

  return (
    <TrainingContext.Provider value={contextValue}>
      <div 
        dir={lang === 'he' ? 'rtl' : 'ltr'} 
        className={lang === 'he' ? 'lang-he' : 'lang-en'}
        style={{ minHeight: '100vh', minHeight: '100dvh', display: 'flex', flexDirection: 'column', position: 'relative' }}
      >
        <BgDecorStars />
        <AppHeader />
        
        <main className="pnm-stage-wrapper">
          {/* Centered Phone Container for All 14 Slides */}
          <div className={`pnm-iphone-mockup ${currentStep === 11 ? 'dark-theme' : ''}`}>
            {/* Top Notch & Status Bar */}
            <div className="pnm-iphone-notch-bar">
              <span className="pnm-phone-clock">12:17</span>
              <div className="pnm-phone-island"></div>
              <div className="pnm-phone-status-icons">
                <span>5G</span>
                <span>📶</span>
                <span>86% 🔋</span>
              </div>
            </div>

            {/* Inner Phone Screen */}
            <div className="pnm-phone-screen-content">
              {renderSlideComponent()}
            </div>

            {/* Home Indicator Bar */}
            <div className="pnm-phone-home-indicator">
              <div className="pnm-home-bar-pill"></div>
            </div>
          </div>

          {/* Bottom Dots Stepper */}
          <div className="pnm-dots-stepper">
            {t.slides.map(s => (
              <div 
                key={s.id}
                className={`pnm-dot ${s.id === currentStep ? 'active' : ''}`}
                onClick={() => goToSlide(s.id)}
                title={`${t.slideLabel} ${s.id}: ${s.title}`}
              ></div>
            ))}
          </div>
        </main>

        {/* Live Content Editor Drawer */}
        <ContentEditorDrawer 
          isOpen={isEditorOpen} 
          onClose={() => setIsEditorOpen(false)} 
          onUpdateSlide={updateSlideData}
        />
      </div>
    </TrainingContext.Provider>
  );
}

// Mount the React Application
const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}
  </script>
</body>
