// ==========================================================================
// 1. Audio Synthesizer (Web Audio API)
// ==========================================================================
class SoundFX {
  constructor() {
    this.ctx = null;
    this.soundEnabled = true;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleSound(enabled) {
    this.soundEnabled = enabled !== undefined ? enabled : !this.soundEnabled;
    return this.soundEnabled;
  }

  playClick() {
    if (!this.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    } catch (e) {}
  }

  playSuccess() {
    if (!this.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.08);
        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);
      });
    } catch (e) {}
  }
}

                  key={p.id}

                    setRev2Step(p.id);

                    {p.title.replace('\n', ' ')}

        >

                  <label
                    key={idx}
                    className={`pnm-quiz-radio-label ${statusCls}`}
                    onClick={() => {
                      soundFX.playClick();
                      setQ1Ans(idx);
                      setQuizChecked(false);
                      setQuizPassed(false);
                    }}
                  >
                    <input
                      type="radio"
                      name="q1"
                      className="pnm-custom-radio"
                      checked={q1Ans === idx}
                      readOnly
                    />
                    <span>{opt}</span>
                  </label>
                );
              })}
            </div>
          </div>

          {/* Question 2 (Correct index: 2 -> C / ג) */}
          <div className="pnm-quiz-q-box">
            <div className="pnm-quiz-q-text">{page.q2}</div>
            <div className="pnm-quiz-options-row">
              {page.q2_opts.map((opt, idx) => {
                let statusCls = '';
                if (q2Ans === idx) statusCls = 'selected';
                if (quizChecked) {
                  if (idx === 2) statusCls = 'correct';
                  else if (q2Ans === idx) statusCls = 'wrong';
                }
                return (
                  <label
                    key={idx}
                    className={`pnm-quiz-radio-label ${statusCls}`}
                    onClick={() => {
                      soundFX.playClick();
                      setQ2Ans(idx);
                      setQuizChecked(false);
                      setQuizPassed(false);
                    }}
                  >
                    <input
                      type="radio"
                      name="q2"
                      className="pnm-custom-radio"
                      checked={q2Ans === idx}
                      readOnly
                    />
                    <span>{opt}</span>
                  </label>
                );
              })}
            </div>
          </div>

          {/* Quiz Feedback Banner */}
          {quizChecked && (
            <div
              style={{
                padding: '10px 14px',
                borderRadius: '12px',
                fontSize: '0.94rem',
                fontWeight: 700,
                textAlign: 'center',
                background: quizPassed ? '#f0fdf4' : '#fef2f2',
                border: `1.5px solid ${quizPassed ? '#86efac' : '#fca5a5'}`,
                color: quizPassed ? '#15803d' : '#b91c1c'
              }}
            >
              {quizPassed ? page.successMsg : page.errorMsg}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ==========================================================================
// 5. Main Application Root Component
// ==========================================================================
function App() {
  const [lang, setLang] = useState('en');
  const [rev2Step, setRev2Step] = useState(1);
  const [soundEnabled, setSoundEnabled] = useState(true);
  const [isClosed, setIsClosed] = useState(false);

  // Quiz state for Slide 6
  const [q1Ans, setQ1Ans] = useState(null);
  const [q2Ans, setQ2Ans] = useState(null);
  const [quizChecked, setQuizChecked] = useState(false);
  const [quizPassed, setQuizPassed] = useState(false);

  const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
  const pages = t.rev2.pages;

  const toggleLanguage = useCallback(() => {
    soundFX.playClick();
    setLang(prev => (prev === 'en' ? 'he' : 'en'));
  }, []);

  const toggleSound = useCallback(() => {
    const newState = soundFX.toggleSound();
    setSoundEnabled(newState);
  }, []);

  const nextRev2 = useCallback(() => {
    soundFX.playClick();
    setRev2Step(prev => (prev < pages.length ? prev + 1 : prev));
  }, [pages.length]);

  const prevRev2 = useCallback(() => {
    soundFX.playClick();
    setRev2Step(prev => (prev > 1 ? prev - 1 : 1));
  }, []);

  const handleCheckQuiz = useCallback(() => {
    soundFX.playClick();
    setQuizChecked(true);
    if (q1Ans === 1 && q2Ans === 2) {
      soundFX.playSuccess();
      setQuizPassed(true);
    } else {
      setQuizPassed(false);
    }
  }, [q1Ans, q2Ans]);

  const handleClose = useCallback(() => {
    soundFX.playClick();
    try {
      window.open('', '_self');
      window.close();
    } catch (e) {}
    setIsClosed(true);
  }, []);

  const contextValue = {
    t,
    lang,
    toggleLanguage,
    rev2Step,
    setRev2Step,
    soundEnabled,
    toggleSound,
    isClosed,
    setIsClosed,
    q1Ans,
    setQ1Ans,
    q2Ans,
    setQ2Ans,
    quizChecked,
    setQuizChecked,
    quizPassed,
    setQuizPassed
  };

  return (
    <TrainingContext.Provider value={contextValue}>
      <div
        dir={lang === 'he' ? 'rtl' : 'ltr'}
        className={lang === 'he' ? 'lang-he' : 'lang-en'}
        style={{ minHeight: '100vh', minHeight: '100dvh', display: 'flex', flexDirection: 'column', position: 'relative' }}
      >
        <BgDecorStars />
        <AppHeader />

        <main className="pnm-stage-wrapper">
          {/* Centered Phone Container (Content Only — No Navigation Inside) */}
          <div className="pnm-iphone-mockup">
            {/* Top Notch & Status Bar */}
            <div className="pnm-iphone-notch-bar">
              <span className="pnm-phone-clock">12:17</span>
              <div className="pnm-phone-island"></div>
              <div className="pnm-phone-status-icons">
                <span>5G</span>
                <span>📶</span>
                <span>86% 🔋</span>
              </div>
            </div>

            {/* Inner Phone Screen */}
            <div className="pnm-phone-screen-content">
              <Rev2AvatarGuide />
            </div>

            {/* Home Indicator Bar */}
            <div className="pnm-phone-home-indicator">
              <div className="pnm-home-bar-pill"></div>
            </div>
          </div>

          {/* External Bottom Navigation Bar (Outside the Smartphone Screen on All Pages) */}
          {!isClosed && (
            <div className="pnm-external-bottom-bar">
              <button
                className="pnm-prev-btn"
                onClick={prevRev2}
                disabled={rev2Step === 1}
              >
                {t.prevBtn}
              </button>

              {rev2Step < 6 ? (
                <button
                  className="pnm-btn-pill-red"
                  style={{ flex: 1 }}
                  onClick={nextRev2}
                >
                  {t.nextBtn}
                </button>
              ) : !quizPassed ? (
                <button
                  className="pnm-btn-pill-red"
                  style={{ flex: 1 }}
                  onClick={handleCheckQuiz}
                >
                  {t.rev2.checkQuizBtn}
                </button>
              ) : (
                <>
                  <button
                    className="pnm-prev-btn"
                    onClick={() => {
                      soundFX.playClick();
                      setQ1Ans(null);
                      setQ2Ans(null);
                      setQuizChecked(false);
                      setQuizPassed(false);
                      setRev2Step(1);
                    }}
                  >
                    {t.rev2.repeatGuideBtn}
                  </button>
                  <button
                    className="pnm-btn-pill-red"
                    style={{ flex: 1 }}
                    onClick={handleClose}
                  >
                    {t.rev2.closeGuideBtn}
                  </button>
                </>
              )}
            </div>
          )}
        </main>
      </div>
    </TrainingContext.Provider>
  );
}

// Mount the React Application
const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}
  </script>
</body>
</html>
