// ==========================================================================
// 1. Audio Synthesizer (Web Audio API)
// ==========================================================================
class SoundFX {
  constructor() {
    this.ctx = null;
    this.soundEnabled = true;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleSound(enabled) {
    this.soundEnabled = enabled !== undefined ? enabled : !this.soundEnabled;
    return this.soundEnabled;
  }

  playClick() {
    if (!this.soundEnabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    } catch (e) {}
  }
}

        <button
          className="pnm-lang-toggle-btn"
          onClick={toggleLanguage}
          title={lang === 'en' ? 'החלף לעברית' : 'Switch to English'}
        >
          <span>🌐</span>
          <span>{lang === 'en' ? 'עברית' : 'English'}</span>

        <div className="pnm-slide-selector-dropdown">

            className="pnm-slide-selector-pill"

          >
            <span dir="ltr">{`${rev2Step}/5`}</span>
            <span style={{ fontSize: '0.65rem' }}>▼</span>
          </div>

          {isDropdownOpen && (
            <div className="pnm-dropdown-menu">
              {t.rev2.pages.map(p => (
                <div
                  key={p.id}
                  className={`pnm-dropdown-item ${p.id === rev2Step ? 'active' : ''}`}
                  onClick={() => {
                    soundFX.playClick();
                    setRev2Step(p.id);
                    setIsDropdownOpen(false);
                  }}
                >
                  <span className="pnm-dropdown-badge" dir="ltr">{p.id}</span>
                  <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {p.title}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Audio Toggle */}
        <button
          className={`pnm-header-btn ${soundEnabled ? 'active' : ''}`}
          onClick={toggleSound}
          title="Toggle Audio Feedback"
        >
          <span>{soundEnabled ? '🔊' : '🔇'}</span>
        </button>
      </div>
    </header>
  );
}

// ==========================================================================
// 5. Main Application Root Component
// ==========================================================================
function App() {
  const [lang, setLang] = useState('en');
  const [rev2Step, setRev2Step] = useState(1);
  const [soundEnabled, setSoundEnabled] = useState(true);
  const [isClosed, setIsClosed] = useState(false);

  const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
  const pages = t.rev2.pages;

  const toggleLanguage = useCallback(() => {
    soundFX.playClick();
    setLang(prev => (prev === 'en' ? 'he' : 'en'));
  }, []);

  const toggleSound = useCallback(() => {
    const newState = soundFX.toggleSound();
    setSoundEnabled(newState);
  }, []);

  const nextRev2 = useCallback(() => {
    soundFX.playClick();
    setRev2Step(prev => (prev < pages.length ? prev + 1 : prev));
  }, [pages.length]);

  const prevRev2 = useCallback(() => {
    soundFX.playClick();
    setRev2Step(prev => (prev > 1 ? prev - 1 : 1));
  }, []);

  const handleClose = useCallback(() => {
    soundFX.playClick();
    try {
      window.open('', '_self');
      window.close();
    } catch (e) {}
    setIsClosed(true);
  }, []);

  const contextValue = {
    t,
    lang,
    toggleLanguage,
    rev2Step,
    setRev2Step,
    soundEnabled,
    toggleSound,
    isClosed,
    setIsClosed
  };

  return (
    <TrainingContext.Provider value={contextValue}>
      <div
        dir={lang === 'he' ? 'rtl' : 'ltr'}
        className={lang === 'he' ? 'lang-he' : 'lang-en'}
        style={{ minHeight: '100vh', minHeight: '100dvh', display: 'flex', flexDirection: 'column', position: 'relative' }}
      >
        <BgDecorStars />
        <AppHeader />

        <main className="pnm-stage-wrapper">
          {/* Centered Phone Container (Content Only — No Navigation Inside) */}
          <div className="pnm-iphone-mockup">
            {/* Top Notch & Status Bar */}
            <div className="pnm-iphone-notch-bar">
              <span className="pnm-phone-clock">12:17</span>
              <div className="pnm-phone-island"></div>
              <div className="pnm-phone-status-icons">
                <span>5G</span>
                <span>📶</span>
                <span>86% 🔋</span>
              </div>
            </div>

            {/* Inner Phone Screen */}
            <div className="pnm-phone-screen-content">
              <Rev2AvatarGuide />
            </div>

            {/* Home Indicator Bar */}
            <div className="pnm-phone-home-indicator">
              <div className="pnm-home-bar-pill"></div>
            </div>
          </div>

          {/* External Bottom Navigation Bar (Outside the Smartphone Screen on All Pages) */}
          {!isClosed && (
            <div className="pnm-external-bottom-bar">
              <button
                className="pnm-prev-btn"
                onClick={prevRev2}
                disabled={rev2Step === 1}
              >
                {t.prevBtn}
              </button>

              {rev2Step < 5 ? (
                <button
                  className="pnm-btn-pill-red"
                  style={{ flex: 1 }}
                  onClick={nextRev2}
                >
                  {t.nextBtn}
                </button>
              ) : (
                <>
                  <button
                    className="pnm-prev-btn"
                    onClick={() => {
                      soundFX.playClick();
                      setRev2Step(1);
                    }}
                  >
                    {t.rev2.repeatGuideBtn}
                  </button>
                  <button
                    className="pnm-btn-pill-red"
                    style={{ flex: 1 }}
                    onClick={handleClose}
                  >
                    {t.rev2.closeGuideBtn}
                  </button>
                </>
              )}
            </div>
          )}
        </main>
      </div>
    </TrainingContext.Provider>
  );
}

// Mount the React Application
const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}
  </script>
</body>
</html>
